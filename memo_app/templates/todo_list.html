<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI ToDo | Memo Garden</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><header class="site-header"><a class="brand" href="/list"><span class="brand-mark">✦</span>Memo Garden</a><nav class="site-nav"><a href="/">新規メモ</a><a href="/list">一覧</a><a href="/list#ai-settings">AI設定</a></nav></header>
<main class="page page-narrow"><div class="page-heading"><p class="eyebrow">AI assistant</p><h1>次にやること。</h1><p class="page-subtitle">メモから見つけた、あなたのための ToDo リストです。</p></div><section class="panel"><div class="ai-output" id="ai-output">{{ todo_content }}</div><div class="button-row"><a class="btn btn-secondary" href="/list">一覧へ戻る</a><a class="btn btn-primary" href="/list#ai-key">もう一度作成する</a></div></section></main><script>
const output=document.getElementById('ai-output');const raw=output.textContent.trim();const clean=text=>text.replace(/\*\*/g,'').replace(/`/g,'').trim();const lines=raw.split('\n');output.textContent='';let list;let activeItem;
const addText=(text,className='todo-intro')=>{if(!text)return;const element=document.createElement('p');element.className=className;element.textContent=clean(text);output.appendChild(element);};
lines.forEach(line=>{const text=line.trim();if(!text||/^---+$/.test(text))return;const task=text.match(/^[*-]\s+\[\s*\]\s+(.+)/);const heading=text.match(/^#{1,6}\s+(.+)/);const detail=text.match(/^(?:[*-]\s*)?(?:\*\*)?(日時|期限|場所|備考)[：:](?:\*\*)?\s*(.+)/);if(heading){const h=document.createElement('h2');h.className='todo-heading';h.textContent=clean(heading[1]);output.appendChild(h);activeItem=null;return;}if(task){if(!list){list=document.createElement('ul');list.className='todo-items';output.appendChild(list);}const item=document.createElement('li');item.className='todo-item';const taskLine=document.createElement('div');taskLine.className='todo-task';const check=document.createElement('span');check.className='todo-check';check.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=clean(task[1]);taskLine.append(check,label);item.appendChild(taskLine);list.appendChild(item);activeItem=item;return;}if(detail&&activeItem){const info=document.createElement('p');info.className='todo-detail';const label=document.createElement('strong');label.textContent=`${detail[1]}：`;info.append(label,document.createTextNode(clean(detail[2])));activeItem.appendChild(info);return;}addText(text);});if(!output.children.length)addText('AIからの回答はありません。');
</script><script src="{{ url_for('static', filename='ui-preferences.js') }}"></script></body></html>
