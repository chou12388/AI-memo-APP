<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メモを編集 | Memo Garden</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body>
<header class="site-header"><a class="brand" href="/list"><span class="brand-mark">✦</span>Memo Garden</a><nav class="site-nav"><a href="/">新規メモ</a><a href="/list">一覧</a><a href="/list#ai-settings">AI設定</a></nav></header>
<main class="page page-narrow"><div class="page-heading"><p class="eyebrow">Edit note</p><h1>メモを整える。</h1><p class="page-subtitle">必要なところだけ、いつでも書き直せます。</p></div>
<form class="panel" action="/edit/{{ memo[0] }}" method="POST">
    <div class="field"><div class="label-row"><label for="title">タイトル</label><button class="text-clear" type="button" data-clear-target="title">クリア</button></div><input type="text" id="title" name="title" value="{{ memo[1] }}" required></div>
    <div class="field"><div class="label-row"><label for="date">日付</label><button class="text-clear" type="button" data-clear-target="date">クリア</button></div><input type="date" id="date" name="date" value="{{ memo[2] }}" required></div>
    <div class="field"><div class="label-row"><label for="content">メモ内容</label><button class="text-clear" type="button" data-clear-target="content">クリア</button></div><div class="content-textarea-wrap"><textarea id="content" name="content" required>{{ memo[3] }}</textarea><div id="content-count" class="character-count" aria-live="polite">0文字</div></div><div class="voice-tools"><button class="btn btn-secondary voice-button" id="memo-voice-button" type="button">🎙 音声で入力</button><select class="voice-select" id="memo-voice-language" aria-label="音声の言語"><option value="ja-JP">日本語</option><option value="zh-CN">中文（普通话）</option></select><span class="voice-status" id="memo-voice-status" aria-live="polite">音声認識の文字はメモ内容に直接入力されます</span></div></div>
    <div class="button-row"><button type="submit" class="btn btn-primary">変更を保存する →</button><a class="btn btn-secondary" href="/detail/{{ memo[0] }}">戻る</a><button class="btn btn-ai" id="open-ai-popup" type="button">✦ AIで整理する</button></div>
</form></main>
<footer class="site-footer">2026張毅の自由課題</footer>

<dialog class="api-key-dialog ai-organizer-dialog" id="ai-organizer-dialog"><div class="ai-organizer"><div class="dialog-heading"><div><h2>AIでメモを整理</h2><p>入力内容からタイトル・日付・メモ内容を作成します。</p></div><button class="dialog-close" id="close-ai-popup" type="button" aria-label="閉じる">×</button></div><div class="field"><div class="label-row"><label for="ai-organizer-input">入力内容</label><button class="text-clear" type="button" data-clear-target="ai-organizer-input">クリア</button></div><div class="content-textarea-wrap"><textarea id="ai-organizer-input" placeholder="ここに内容を入力するか、音声で入力してください"></textarea><div id="ai-organizer-count" class="character-count" aria-live="polite">0文字</div></div><div class="voice-tools"><button class="btn btn-secondary voice-button" id="ai-voice-button" type="button">🎙 音声で入力</button><select class="voice-select" id="ai-voice-language" aria-label="音声の言語"><option value="ja-JP">日本語</option><option value="zh-CN">中文（普通话）</option></select><span class="voice-status" id="ai-voice-status" aria-live="polite"></span></div></div><p class="form-note" id="ai-organizer-status" aria-live="polite"></p><div class="button-row"><button class="btn btn-primary" id="run-ai-organizer" type="button">✦ AIで整理する</button><button class="btn btn-secondary" id="close-ai-popup-secondary" type="button">閉じる</button></div></div></dialog>
<script src="{{ url_for('static', filename='voice-note.js') }}"></script>
<script src="{{ url_for('static', filename='ui-preferences.js') }}"></script></body></html>
